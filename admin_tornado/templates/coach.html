<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Edumerc Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- Sidebar (Simplified) -->
        <div class="p-6 text-2xl font-bold tracking-tight">Edumerc Admin</div>
        <nav class="flex-1 px-4 py-4 space-y-1">
            <a href="/" class="flex items-center px-4 py-3 text-sm font-medium text-indigo-100 hover:bg-indigo-800 rounded-lg">Dashboard</a>
            <a href="/users" class="flex items-center px-4 py-3 text-sm font-medium text-indigo-100 hover:bg-indigo-800 rounded-lg">Users & Roles</a>
            <a href="/shop" class="flex items-center px-4 py-3 text-sm font-medium text-indigo-100 hover:bg-indigo-800 rounded-lg">EduShop</a>
            <a href="/orders" class="flex items-center px-4 py-3 text-sm font-medium text-indigo-100 hover:bg-indigo-800 rounded-lg">Orders</a>
            <a href="/coach" class="flex items-center px-4 py-3 text-sm font-medium bg-white/10 border-l-4 border-white rounded-lg">EduCoach</a>
            <a href="/sessions" class="flex items-center px-4 py-3 text-sm font-medium text-indigo-100 hover:bg-indigo-800 rounded-lg">Sessions</a>
        </nav>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-8">
            <h1 class="text-xl font-semibold text-gray-800">EduCoach Management</h1>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Coach</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price/hr</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rating</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        {% for coach in coaches %}
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium text-gray-900">{{ coach.user.username }}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                {{ coach.title }}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-semibold">
                                ${{ coach.price_per_hour }}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-yellow-500">
                                {{ coach.rating }} ⭐
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <a href="#" class="text-indigo-600 hover:text-indigo-900">Edit</a>
                            </td>
                        </tr>
                        {% end %}
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
